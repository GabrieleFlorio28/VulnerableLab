services:
  sql-injection:
    build: ./sql-injection
    ports:
      - "5000:5000"
    volumes:
      - ./sql-injection:/app
    restart: unless-stopped
    networks:
      - sql_net

  broken-auth:
    build: ./broken-auth
    ports:
      - "5001:5000"
    volumes:
      - ./broken-auth:/app
    restart: unless-stopped
    networks:
      - auth_net

  privilege-escalation:
    build: ./privilege-escalation
    ports:
      - "5002:5000"
    volumes:
      - ./privilege-escalation:/app
    restart: unless-stopped
    networks:
      - priv_net

  misconfiguration:
    build: ./misconfiguration
    ports:
      - "5003:5000"
    environment:
      - DEBUG_MODE=true
    volumes:
      - ./misconfiguration:/app
    restart: unless-stopped
    networks:
      - misconf_net

# altri scenari possono essere aggiunti come servizi separati

networks:
  sql_net:
  auth_net:
  priv_net:
  misconf_net:
